<main class="p-6 flex flex-col gap-6">
    <section>
        <app-page-header title="الحسابات والصلاحيات" [home]="home"
            [breadcrumbItems]="breadcrumbItems"></app-page-header>
    </section>
    <section>
        <div class="flex flex-col gap-1 mb-8">
            <h2 class="text-[#1E293B] text-2xl font-medium">إضافة حساب جديد</h2>
            <p class="text-text-secondary text-base font-medium">
                قم بإنشاء ملف تعريف جديد للموظف وتحديد صلاحياته في النظام
            </p>
        </div>

        <div *ngIf="isLoadingOptions" class="text-text-secondary text-sm mb-4">
            جاري تحميل الأدوار والصلاحيات...
        </div>

        <form *ngIf="!isLoadingOptions" [formGroup]="userForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-8">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 p-5 bg-white rounded-3xl">
                <h2 class="text-[#1E293B] text-base font-medium mb-7 sm:col-span-2">المعلومات الأساسية</h2>

                <app-shared-text-input formControlName="fullName" label="ادخل الاسم بالكامل"
                    placeholder="الاسم الاول بالكامل" inputId="fullName" primeNgIcon="pi pi-user"
                    [isRequired]="true"></app-shared-text-input>
                <app-shared-text-input formControlName="email" label="البريد الالكتروني"
                    placeholder="ادخل البريد الالكتروني" inputId="email" primeNgIcon="pi pi-envelope"
                    [isRequired]="true"></app-shared-text-input>
                <app-shared-text-input formControlName="phone" label="رقم الهاتف" placeholder="ادخل رقم الهاتف"
                    inputId="phone" primeNgIcon="pi pi-phone" [isRequired]="true"></app-shared-text-input>
                <app-shared-text-input formControlName="branch" label="الفرع" placeholder="ادخل الفرع" inputId="branch"
                    primeNgIcon="pi pi-building" [isRequired]="true"></app-shared-text-input>
                <app-shared-text-input formControlName="password" label="كلمة المرور" placeholder="ادخل كلمة المرور"
                    inputId="password" primeNgIcon="pi pi-lock" [isRequired]="true"
                    type="password"></app-shared-text-input>

                <app-shared-select formControlName="role" label="الدور الوظيفي" placeholder="اختر الدور الوظيفي"
                    inputId="role" [options]="roleOptions" optionLabel="label" optionValue="value"
                    primeNgIcon="pi pi-briefcase" [isRequired]="true"></app-shared-select>

                <app-shared-select formControlName="permissions_mode" label="نوع الصلاحيات"
                    placeholder="اختر نوع الصلاحيات" inputId="permissions_mode" [options]="permissionsModeOptions"
                    optionLabel="label" optionValue="value" primeNgIcon="pi pi-shield"
                    [isRequired]="true"></app-shared-select>
            </div>

            <!-- Permissions catalog — fetched live from admin/employees/permissions -->
            <div *ngIf="isLimitedAccess" class="p-2.5 bg-white rounded-3xl">
                <h2 class="text-[#1E293B] text-base font-medium mb-4 px-6 py-1.5">الصلاحيات</h2>
                <p class="text-text-secondary text-xs px-6 mb-4" *ngIf="userForm.get('role')?.value">
                    تم تحديد الصلاحيات الافتراضية لهذا الدور، يمكنك تعديلها حسب الحاجة
                </p>

                <div *ngFor="let category of permissionsCatalog" class="mb-4 px-3.5">
                    <h3 class="text-sm font-semibold text-text-secondary mb-2 px-2.5">{{ category.label }}</h3>

                    <div *ngFor="let permission of category.permissions"
                        class="px-4 py-2.5 bg-white rounded-2xl border border-[#F8FAFC] flex flex-row justify-between items-center mb-2">
                        <p class="text-[#334155] text-sm font-medium">{{ permission.label }}</p>
                        <div dir="ltr">
                            <p-toggleswitch (onChange)="togglePermission(permission.key, $event.checked)" />
                            <!-- [ngModel]="isPermissionSelected(permission.key)"
                                [ngModelOptions]="{ standalone: true }" -->
                        </div>
                    </div>
                </div>
            </div>

            <p *ngIf="errorMessage" class="text-red-500 text-sm">{{ errorMessage }}</p>

            <div class="flex flex-row gap-8 justify-end">
                <button type="button" (click)="onCancel()"
                    class="px-10 sm:px-18 py-3 bg-[#CBD4E2] text-black rounded-xl cursor-pointer w-fit">
                    إلغاء
                </button>
                <button type="submit" [disabled]="userForm.invalid || isSubmitting"
                    class="px-10 sm:px-18 py-3 bg-primary text-white rounded-xl cursor-pointer w-fit disabled:opacity-50 disabled:cursor-not-allowed">
                    {{ isSubmitting ? 'جاري الإضافة...' : 'إضافة' }}
                </button>
            </div>
        </form>
    </section>
</main>
