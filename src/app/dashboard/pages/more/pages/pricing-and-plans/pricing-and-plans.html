<p-confirmdialog></p-confirmdialog>

<main class="p-6 flex flex-col gap-6">
    <section>
        <app-page-header title="التسعير والباقات" [home]="home" [breadcrumbItems]="breadcrumbItems"></app-page-header>
    </section>

    <div class="flex flex-row justify-between flex-wrap items-center">
        <p class="text-base text-[#43493E] font-medium py-3">
            تحكم في خطط الاشتراك، الأسعار، والقيود لكل باقة
        </p>
        <button type="button" (click)="onAddNew()"
            class="px-12 py-3 text-white bg-primary text-base font-bold rounded-2xl cursor-pointer inline-flex items-center gap-2">
            <img src="assets/icons/global/plus.svg" alt="Plus">
            إضافة باقة جديدة
        </button>
    </div>

    <section *ngIf="isLoading">
        <p class="text-text-secondary text-sm">جاري التحميل...</p>
    </section>

    <section *ngIf="!isLoading && errorMessage">
        <p class="text-red-500 text-sm">{{ errorMessage }}</p>
    </section>

    <section *ngIf="!isLoading && !errorMessage" class="bg-white px-2.5 py-6 rounded-xl">
        <div class="flex flex-row justify-between items-center mb-8">
            <h2 class="text-[#191C18] text-2xl font-tajawal font-medium">
                الباقات الحالية
            </h2>
            <p class="text-[#42493F] text-base font-tajawal font-medium">
                {{ plans.length }} باقات
            </p>
        </div>

        <div *ngIf="plans.length === 0" class="text-center text-text-secondary text-sm py-10">
            لا توجد باقات متاحة حالياً
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8">
            <div *ngFor="let plan of plans; trackBy: trackByPlanId"
                class="relative bg-white p-8 rounded-xl flex flex-col gap-6 border-2"
                [ngClass]="plan.is_active ? 'border-[#C1C9B94D]' : 'border-red-200 opacity-70'">

                <!-- Inactive badge (derived from is_active — no "featured" field exists in the API) -->
                <span *ngIf="!plan.is_active"
                    class="absolute top-3 right-11 translate-x-1/2 -translate-y-1/2 bg-[#DC2626] text-white text-xs font-tajawal font-medium px-4 py-1 rounded-bl-xl rounded-tr-xl">
                    غير نشطة
                </span>

                <div class="flex flex-row gap-7 items-center justify-between">
                    <h2 class="text-[#191C18] text-2xl font-tajawal font-medium">
                        {{ plan.name }}
                    </h2>

                    <p-menu #menu [popup]="true" appendTo="body" [style]="{ minWidth: '160px' }"></p-menu>
                    <button type="button" class="p-1 hover:bg-gray-100 rounded-lg transition-colors cursor-pointer"
                        (click)="onMenuClick(menu, plan, $event)">
                        <img src="assets/icons/global/menu_dots.svg" alt="more" />
                    </button>
                </div>

                <div class="flex flex-col gap-4">
                    <div *ngFor="let feature of getFeatures(plan)"
                        class="flex flex-row gap-10 items-center justify-between">
                        <p class="text-[#42493F] text-sm font-tajawal font-medium">
                            {{ feature.label }}
                        </p>
                        <p class="text-[#0D7F1A] text-sm font-tajawal font-bold">
                            {{ feature.value }}
                        </p>
                    </div>
                </div>

                <hr>

                <div class="flex flex-col gap-3">
                    <div *ngFor="let tier of getPricingTiers(plan)"
                        class="flex flex-row gap-10 items-center justify-between px-4 py-2 bg-[#F7F9F2] rounded-lg">
                        <p class="text-[#42493F] text-xs font-tajawal font-medium">
                            {{ tier.label }}
                        </p>
                        <p class="text-[#196D00] text-lg font-tajawal font-medium">
                            {{ tier.price }}
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
