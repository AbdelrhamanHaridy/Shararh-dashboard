<div class="relative p-6 flex flex-col gap-6" dir="rtl">
    <button type="button" (click)="onClose()"
        class="absolute left-6 top-6 text-[#334155] hover:text-black cursor-pointer">
        <i class="pi pi-times text-lg"></i>
    </button>

    <h2 class="text-center text-lg font-bold text-[#0F172A] mt-1">{{ title }}</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
        <div class="flex flex-col gap-2">
            <label class="text-sm font-medium text-[#334155]">المبلغ</label>
            <div class="flex flex-row items-center justify-between px-4 py-3.5 rounded-xl border border-[#E2E8F0]">
                <span class="text-sm font-bold text-[#10A922]">EGP</span>
                <input type="number" formControlName="amount" min="0"
                    class="flex-1 text-left bg-transparent border-none outline-none text-base font-medium text-[#1A1C18]" />
            </div>
            <p *ngIf="form.get('amount')?.invalid && form.get('amount')?.touched" class="text-xs text-red-500">
                ادخل مبلغ صحيح
            </p>
        </div>

        <div class="flex flex-col gap-2">
            <label class="text-sm font-medium text-[#334155]">الوصف</label>
            <textarea formControlName="description" rows="4" placeholder="اكتب الوصف .."
                class="p-3 rounded-xl border border-[#E2E8F0] focus:outline-none focus:ring-2 focus:ring-primary text-sm resize-none"></textarea>
        </div>

        <p *ngIf="errorMessage" class="text-red-500 text-sm text-center">{{ errorMessage }}</p>

        <button type="submit" [disabled]="form.invalid || isSubmitting || !userId"
            class="w-full py-4 bg-primary text-white rounded-2xl font-bold text-sm cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
            {{ submitLabel }}
        </button>
    </form>
</div>
