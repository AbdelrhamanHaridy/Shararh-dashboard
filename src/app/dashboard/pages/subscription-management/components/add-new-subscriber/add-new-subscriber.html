<div class="">
    <div class="p-fluid">
        <form [formGroup]="subscriberForm" (ngSubmit)="saveAndClose()" class="flex flex-col gap-6">
            <div class="flex flex-col gap-5 bg-white rounded-lg">

                <!-- Subscriber name (autocomplete) -->
                <div class="flex flex-col gap-2">
                    <label for="subscriberName" class="text-[#44483f] text-base font-medium">
                        اسم المشترك <span class="text-[#D22F27]">*</span>
                    </label>
                    <p-autocomplete inputId="subscriberName" formControlName="subscriberName"
                        [suggestions]="ownerSuggestions" optionLabel="name" [dropdown]="true" dropdownMode="blank"
                        placeholder="ابحث باسم المشترك" [fluid]="true" appendTo="body"
                        (completeMethod)="onSearchName($event)" (onSelect)="onOwnerSelect($event)">
                        <ng-template #item let-owner>
                            <div class="flex flex-col">
                                <span class="text-[#0F172A] text-sm font-medium">{{ owner.name }}</span>
                                <span class="text-text-secondary text-xs">{{ owner.phone }}</span>
                                @if (hasMoreOwners && owner.id === lastOwnerId) {
                                <span appInView (inView)="loadMoreOwners()" class="block h-px"></span>
                                }
                            </div>
                        </ng-template>
                        <ng-template #footer>
                            @if (isLoadingOwners) {
                            <div class="px-3 py-2 text-center text-xs text-text-secondary">جاري التحميل...</div>
                            }
                        </ng-template>
                    </p-autocomplete>
                </div>

                <!-- Phone (autocomplete) -->
                <div class="flex flex-col gap-2">
                    <label for="phoneNumber" class="text-[#44483f] text-base font-medium">
                        رقم الجوال للتواصل <span class="text-[#D22F27]">*</span>
                    </label>
                    <p-autocomplete inputId="phoneNumber" formControlName="phoneNumber" [suggestions]="ownerSuggestions"
                        optionLabel="phone" [dropdown]="true" dropdownMode="blank" placeholder="ادخل رقم الجوال"
                        [fluid]="true" appendTo="body" (completeMethod)="onSearchPhone($event)"
                        (onSelect)="onOwnerSelect($event)">
                        <ng-template #item let-owner>
                            <div class="flex flex-col">
                                <span class="text-[#0F172A] text-sm font-medium">{{ owner.phone }}</span>
                                <span class="text-text-secondary text-xs">{{ owner.name }}</span>
                                @if (hasMoreOwners && owner.id === lastOwnerId) {
                                <span appInView (inView)="loadMoreOwners()" class="block h-px"></span>
                                }
                            </div>
                        </ng-template>
                        <ng-template #footer>
                            @if (isLoadingOwners) {
                            <div class="px-3 py-2 text-center text-xs text-text-secondary">جاري التحميل...</div>
                            }
                        </ng-template>
                    </p-autocomplete>
                </div>

                <!-- Store (filled from the selected owner) -->
                <app-shared-select formControlName="storeId" label="المحل" placeholder="اختر المحل" inputId="storeId"
                    [options]="stores" optionLabel="label" optionValue="value" primeNgIcon="pi pi-shop"
                    [isRequired]="true"></app-shared-select>

                <app-shared-select formControlName="packageType" label="نوع الباقة" inputId="packageType"
                    [placeholder]="isLoadingPlans ? 'جاري تحميل الباقات...' : packages.length ? 'اختر نوع الباقة' : 'لا توجد باقات متاحة'"
                    [options]="packages" optionLabel="label" optionValue="value"
                    primeNgIcon="pi pi-box" [isRequired]="true"></app-shared-select>

                <app-shared-select formControlName="subscriptionDuration" label="مدة الاشتراك"
                    placeholder="اختر مدة الاشتراك" inputId="subscriptionDuration" [options]="subscriptionDurations"
                    optionLabel="label" optionValue="value" primeNgIcon="pi pi-calendar"
                    [isRequired]="true"></app-shared-select>

                <app-shared-select formControlName="paymentMethod" label="طريقة الدفع" inputId="paymentMethod"
                    [placeholder]="isLoadingPaymentMethods ? 'جاري تحميل طرق الدفع...' : paymentMethods.length ? 'اختر طريقة الدفع' : 'لا توجد طرق دفع متاحة'"
                    [options]="paymentMethods" optionLabel="label" optionValue="value"
                    primeNgIcon="pi pi-credit-card" [isRequired]="true"></app-shared-select>

                <div class="field">
                    <label for="paymentNotes" class="text-[#44483f] text-base font-medium">ملاحظات الدفع</label>
                    <textarea id="paymentNotes" formControlName="paymentNotes" placeholder="ادخل ملاحظات الدفع"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg mt-2" rows="4"></textarea>
                </div>

                <button type="submit" [disabled]="!canSubmit"
                    class="px-18 py-3 bg-primary text-white rounded-2xl cursor-pointer w-full hover:bg-primary-dark transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    {{ isSubmitting ? 'جاري الإضافة...' : 'إضافة' }}
                </button>
            </div>

            <div class="dialog-actions flex flex-row gap-4 justify-end">
                <button type="button" (click)="closeDialog()"
                    class="px-6 py-2 rounded-lg border border-[#E2E8F0] text-[#0F172A] text-sm font-medium cursor-pointer hover:bg-gray-50">
                    إلغاء
                </button>
            </div>
        </form>
    </div>
</div>
