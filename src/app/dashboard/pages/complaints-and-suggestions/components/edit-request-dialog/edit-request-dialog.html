<form *ngIf="requestForm" [formGroup]="requestForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6" dir="rtl">
    <div class="flex flex-col gap-5 bg-white rounded-lg p-6">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <app-shared-text-input formControlName="customer_name" label="اسم العميل" placeholder="ادخل اسم العميل"
                inputId="edit_customer_name" [isRequired]="true" type="text">
            </app-shared-text-input>

            <app-shared-text-input formControlName="phone" label="رقم الهاتف" placeholder="ادخل رقم الهاتف"
                inputId="edit_phone" [isRequired]="true" type="text">
            </app-shared-text-input>
        </div>

        <div class="flex flex-col gap-2">
            <p class="text-sm text-[#44483F] font-medium">نوع الطلب</p>
            <div class="flex flex-wrap gap-3">
                <button type="button" (click)="selectType('suggestion')" [ngClass]="requestForm.get('type')?.value === 'suggestion'
                        ? 'bg-primary-op-10 text-primary border-primary'
                        : 'bg-white text-text-primary border-[#E0E4DA]'"
                    class="inline-flex items-center justify-center gap-2 rounded-xl cursor-pointer px-6 py-2.5 text-sm font-medium border-2 transition-colors">
                    <span>اقتراح</span>
                </button>
                <button type="button" (click)="selectType('complaint')" [ngClass]="requestForm.get('type')?.value === 'complaint'
                        ? 'bg-primary-op-10 text-primary border-primary'
                        : 'bg-white text-text-primary border-[#E0E4DA]'"
                    class="inline-flex items-center justify-center gap-2 rounded-xl cursor-pointer px-6 py-2.5 text-sm font-medium border-2 transition-colors">
                    <span>شكوى</span>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <app-shared-select formControlName="status" label="الحالة" placeholder="اختر الحالة" inputId="edit_status"
                [options]="statusOptions" optionLabel="label" optionValue="value" [isRequired]="true">
            </app-shared-select>

            <app-shared-select formControlName="category" label="التصنيف" placeholder="اختر التصنيف"
                inputId="edit_category" [options]="categoryOptions" optionLabel="label" optionValue="value"
                [isRequired]="true">
            </app-shared-select>

            <app-shared-select formControlName="source" label="مصدر التواصل" placeholder="اختر مصدر التواصل"
                inputId="edit_source" [options]="sourceOptions" optionLabel="label" optionValue="value"
                [isRequired]="true">
            </app-shared-select>

            <app-shared-select formControlName="department" label="القسم المختص" placeholder="اختر القسم"
                inputId="edit_department" [options]="departmentOptions" optionLabel="label" optionValue="value"
                [isRequired]="true">
            </app-shared-select>

            <app-shared-text-input formControlName="branch_id" label="رقم الفرع" placeholder="ادخل رقم الفرع"
                inputId="edit_branch_id" [isRequired]="true" type="number">
            </app-shared-text-input>

            <app-shared-text-input formControlName="assigned_user_id" label="معرف الموظف المسؤول (اختياري)"
                placeholder="ادخل معرف الموظف" inputId="edit_assigned_user_id" [isRequired]="false" type="number">
            </app-shared-text-input>
        </div>

        <div class="flex flex-col gap-2">
            <label for="edit_details" class="text-sm font-medium text-text-primary">تفاصيل الطلب</label>
            <textarea id="edit_details" formControlName="details" placeholder="اكتب هنا ..."
                class="p-3 rounded-xl border border-[#E2E8F0] focus:outline-none focus:ring-2 focus:ring-primary text-sm"
                rows="3"></textarea>
        </div>

        <div class="flex flex-col gap-2">
            <label for="edit_admin_notes" class="text-sm font-medium text-text-primary">ملاحظات الإدارة (اختياري)</label>
            <textarea id="edit_admin_notes" formControlName="admin_notes" placeholder="اكتب هنا ..."
                class="p-3 rounded-xl border border-[#E2E8F0] focus:outline-none focus:ring-2 focus:ring-primary text-sm"
                rows="2"></textarea>
        </div>

        <p *ngIf="errorMessage" class="text-red-500 text-sm">{{ errorMessage }}</p>

        <div class="dialog-actions flex flex-row gap-4 justify-end border-t pt-4">
            <button type="button"
                class="px-12 py-3 bg-gray-200 text-gray-700 rounded-2xl cursor-pointer w-fit hover:bg-gray-300 transition-colors"
                (click)="onCancel()">
                إلغاء
            </button>
            <button type="submit"
                class="px-12 py-3 bg-primary text-white rounded-2xl cursor-pointer w-fit hover:bg-primary-dark transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                [disabled]="requestForm.invalid || isSubmitting">
                {{ isSubmitting ? 'جاري الحفظ...' : 'حفظ التعديلات' }}
            </button>
        </div>
    </div>
</form>

<div *ngIf="!requestForm && errorMessage" class="p-6 text-red-500 text-sm">
    {{ errorMessage }}
</div>
