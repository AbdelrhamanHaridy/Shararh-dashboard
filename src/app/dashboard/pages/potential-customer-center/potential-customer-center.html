<section class="px-6">
    <app-page-header title="مركز العملاء المحتملين" [home]="home" [breadcrumbItems]="breadcrumbItems"
        [showActionButton]="true" actionButtonLabel="إضافة عميل جديد"
        (actionButtonClick)="onActionButtonClick($event, actionMenu)"></app-page-header>
    <p-menu #actionMenu [popup]="true" [model]="actionMenuItems" appendTo="body"></p-menu>
</section>
<section class="p-6 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2.5">
    <app-shared-kpi-card [title]="'نقاط اليوم'" [number]="stats.today_points" iconPath="assets/icons/cards/glance.svg"
        iconBgColor="#EAD9FF" numberColor="#000">
    </app-shared-kpi-card>
    <app-shared-kpi-card [title]="'إجمالي النقاط'" [number]="stats.total_points"
        iconPath="assets/icons/cards/blocks.svg" iconBgColor="#D7EBFF" numberColor="#000">
    </app-shared-kpi-card>
    <app-shared-kpi-card [title]="'مشترك'" [number]="stats.subscribed_leads"
        iconPath="assets/icons/cards/circle_check.svg" iconBgColor="#D8FFDC" numberColor="#000">
    </app-shared-kpi-card>
    <app-shared-kpi-card [title]="'مرفوض'" [number]="stats.rejected_leads" iconPath="assets/icons/cards/timer_off.svg"
        iconBgColor="#FDD9BD" numberColor="#000">
    </app-shared-kpi-card>


</section>

<!-- Custom Tabs Section -->
<section class="px-6 mb-6" dir="rtl">
    <div class="flex gap-2 border-b-2 border-[#E2E8F0]">
        <button type="button" (click)="switchTab('underImplementation')"
            [class]="activeTab === 'underImplementation' 
                ? 'px-6 py-3 text-base font-medium font-tajawal text-primary border-b-2 border-primary -mb-0.5 transition-all' 
                : 'px-6 py-3 text-base font-medium font-tajawal text-[#8A97A8] hover:text-text-primary transition-all'">
            تحت التنفيذ
        </button>
        <button type="button" (click)="switchTab('potential')"
            [class]="activeTab === 'potential' 
                ? 'px-6 py-3 text-base font-medium font-tajawal text-primary border-b-2 border-primary -mb-0.5 transition-all' 
                : 'px-6 py-3 text-base font-medium font-tajawal text-[#8A97A8] hover:text-text-primary transition-all'">
            العملاء المحتملون
        </button>
    </div>
</section>

<section class="p-6">
    <div class="p-6 bg-white rounded-2xl shadow-md flex flex-col gap-5">
        <!-- Search Bar -->
        <div class="flex items-center gap-2 px-5 py-4 rounded-[15px] bg-[#F8FAFC] text-[#6B7280]"
            style="width: 879px; height: 52px;">
            <img src="assets/icons/global/search.svg" alt="search" class="w-5 h-5" />
            <input type="text" placeholder="ابحث..." [value]="searchTerm"
                (input)="onSearchInput($any($event.target).value)"
                class="w-full bg-transparent border-none outline-none font-tajawal font-normal text-base leading-none tracking-normal text-right"
                style="color: #6B7280;" />
        </div>

        <!-- Filter Buttons -->
        <div class="flex flex-row gap-5">
            @for (s of statuses; track s.key) {
            <button type="button" (click)="setStatusFilter(s.key)"
                [class]="selectedStatus === s.key ? 'inline-flex items-center gap-2 rounded-2xl bg-primary-op-10 cursor-pointer px-7 py-2 text-sm font-medium text-primary border border-primary transition-colors' : 'inline-flex items-center gap-2 rounded-2xl bg-white cursor-pointer px-7 py-2 text-sm font-medium text-text-primary border border-[#E2E8F0] transition-colors hover:bg-primary-op-10'">
                <span>{{ s.label }}</span>
            </button>
            }
        </div>
    </div>
</section>

@if (isLoadingLeads) {
<section class="p-6">
    <p class="text-sm text-[#8A97A8] font-tajawal">جارٍ التحميل...</p>
</section>
} @else if (loadError) {
<section class="p-6">
    <p class="text-sm text-red-500 font-tajawal">{{ loadError }}</p>
</section>
} @else if (currentCustomers.length === 0) {
<section class="p-6">
    <p class="text-sm text-[#8A97A8] font-tajawal">لا توجد نتائج مطابقة</p>
</section>
} @else {
<section class="p-6">
    <div class="grid grid-cols-1 md:grid-cols-2 2xl:grid-cols-3 gap-5">
        @for (customer of currentCustomers; track customer.id) {
        <app-customer-card [customer]="customer" [mode]="activeTab" (copyPhone)="copyToClipboard($event)"
            (changeStatus)="onChangeStatus($event)" (whatsappContact)="onWhatsappContact($event)"
            (phoneCall)="onPhoneCall($event)" (acceptCustomer)="onAcceptCustomer($event)"
            (editCustomer)="showEditPotentialCustomerDialog($event)" (deleteCustomer)="onDeleteCustomer($event)"
            (archiveCustomer)="onArchiveCustomer($event)" />
        }
    </div>
</section>
}
