<div class="w-full max-w-sm mx-auto bg-white rounded-2xl font-tajawal">

    <!-- Header -->
    <div class="relative flex items-center justify-center px-6 py-4">
        <h2 class="text-center text-[#191C18] text-base font-bold">استيراد عملاء محتملين</h2>
        <button type="button" (click)="onClose()"
            class="absolute right-6 text-gray-400 hover:text-gray-600 cursor-pointer">
            <i class="pi pi-times text-lg"></i>
        </button>
    </div>

    <div class="flex flex-col gap-5 px-6 pb-6">

        <!-- Template download -->
        <button type="button" (click)="downloadTemplate()" [disabled]="isDownloadingTemplate"
            class="flex flex-row items-center justify-center gap-2 py-2.5 rounded-xl border border-[#E2E8F0] text-sm font-medium text-[#42493F] hover:bg-gray-50 transition-colors cursor-pointer disabled:opacity-50">
            <i class="pi pi-download text-sm"></i>
            <span>{{ isDownloadingTemplate ? 'جارٍ التجهيز...' : 'تحميل القالب' }}</span>
        </button>

        <!-- Dropzone -->
        <div *ngIf="!selectedFile" (click)="onBrowseClick(fileInput)" (dragover)="onDragOver($event)"
            (dragleave)="onDragLeave($event)" (drop)="onDrop($event)"
            class="flex flex-col items-center justify-center gap-4 py-10 px-6 rounded-xl border-2 border-dashed cursor-pointer transition-colors"
            [ngClass]="isDraggingOver ? 'border-[#22C55E] bg-[#F0FDF4]' : 'border-[#BFDBFE] bg-[#F8FAFF]'">

            <img src="assets/icons/global/upload_icon.svg" alt="رفع ملف" class="w-[69px] object-contain" />

            <div class="flex flex-row items-center gap-1 text-sm">
                <span class="text-[#64748B]">سحب وإسقاط أو</span>
                <button type="button" (click)="$event.stopPropagation(); onBrowseClick(fileInput)"
                    class="text-[#22C55E] font-medium underline cursor-pointer">
                    ابحث هنا
                </button>
            </div>

            <p class="text-[#94A3B8] text-xs">الملفات المسموحة : {{ allowedTypes }}</p>

            <input #fileInput type="file" accept=".xlsx" class="hidden" (change)="onFilesSelected($event)" />
        </div>

        <!-- Parsing state -->
        <div *ngIf="stage() === 'parsing'" class="flex flex-col gap-2 border border-gray-200 rounded-lg p-3">
            <div class="flex flex-row items-center justify-between gap-3">
                <span class="flex-1 text-left text-sm text-[#334155] truncate">{{ selectedFile?.name }}</span>
            </div>
            <p class="text-[#64748B] text-xs">جارٍ تحليل الملف...</p>
        </div>

        <!-- Error state -->
        <div *ngIf="stage() === 'error'" class="flex flex-col gap-2 border border-red-200 bg-red-50 rounded-lg p-3">
            <p class="text-red-600 text-sm">{{ errorMessage() }}</p>
        </div>

        <!-- Ready / uploading: parsed file summary -->
        <div *ngIf="stage() === 'ready' || stage() === 'uploading'" class="flex flex-col gap-3">
            <p class="text-[#64748B] text-sm text-right">جاهز للاستيراد</p>

            <div class="flex flex-row items-center justify-between gap-3 border border-[#86EFAC] rounded-lg px-4 py-3">
                <button type="button" (click)="removeFile()" [disabled]="stage() === 'uploading'"
                    class="cursor-pointer shrink-0 disabled:opacity-50">
                    <img src="assets/icons/global/red_delete.svg" alt="حذف الملف" class="w-4 h-4 object-contain" />
                </button>
                <div class="flex-1 flex flex-col items-end">
                    <span class="text-sm text-[#334155] truncate">{{ selectedFile?.name }}</span>
                    <span class="text-xs text-[#64748B]">{{ parsedLeads.length }} عميل محتمل</span>
                </div>
            </div>
        </div>

        <!-- Submit -->
        <button type="button" (click)="onUploadFiles()"
            [disabled]="stage() !== 'ready'"
            class="w-full py-3 bg-[#22C55E] hover:bg-[#16A34A] disabled:opacity-50 disabled:cursor-not-allowed text-white text-sm font-medium rounded-xl transition-colors cursor-pointer">
            {{ stage() === 'uploading' ? 'جارٍ الاستيراد...' : 'استيراد العملاء' }}
        </button>
    </div>
</div>
