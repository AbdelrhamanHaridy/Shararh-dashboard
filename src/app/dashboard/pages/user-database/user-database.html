<section class="px-6">
    <app-page-header title="قاعدة بيانات المستخدمين" [home]="home" [breadcrumbItems]="breadcrumbItems"
        [showActionButton]="true" actionButtonLabel="إضافة مستخدم جديد"
        (actionButtonClick)="onAddUser()"></app-page-header>
</section>

<section class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-2.5">
    <app-shared-kpi-card [title]="'إجمالي المستخدمين'" [number]="0" iconPath="assets/icons/cards/people.svg"
        iconBgColor="#EAD9FF" numberColor="#000">
    </app-shared-kpi-card>
    <app-shared-kpi-card [title]="'مستخدمي تطبيق الادمن'" [number]="0" iconPath="assets/icons/cards/people.svg"
        iconBgColor="#D7EBFF" numberColor="#000">
    </app-shared-kpi-card>
    <app-shared-kpi-card [title]="'المستخدمون غير النشطين'" [number]="0" iconPath="assets/icons/cards/brown_bag.svg"
        iconBgColor="#FFF4D8" numberColor="#000">
    </app-shared-kpi-card>
    <app-shared-kpi-card [title]="'المستخدمين النشطين'" [number]="0" iconPath="assets/icons/cards/circle_check.svg"
        iconBgColor="#DEFFE2" numberColor="#000">
    </app-shared-kpi-card>
</section>

<section class="p-6">
    <div class="p-6 bg-white rounded-2xl shadow-md flex flex-col gap-5 relative">
        <!-- Search Bar -->
        <div class="flex items-center gap-2 px-5 py-4 rounded-[15px] bg-[#F8FAFC] text-[#6B7280]" style="height: 52px;">
            <img src="assets/icons/global/search.svg" alt="search" class="w-5 h-5" />
            <input type="text" placeholder="ابحث..." [ngModel]="searchTerm" (ngModelChange)="onSearchInput($event)"
                class="w-full bg-transparent border-none outline-none font-tajawal font-normal text-base leading-none tracking-normal text-right"
                style="color: #6B7280;" />
        </div>

        <!-- Buttons -->
        <div class="flex flex-row gap-5">
            <button type="button" (click)="onTypeChange('admin_app')"
                [class.filter-button-active]="selectedType === 'admin_app'"
                [attr.aria-pressed]="selectedType === 'admin_app'" class="user-app-filter-button">
                <span>تطبيق الادمن</span>
            </button>
            <button type="button" (click)="onTypeChange('employee_app')"
                [class.filter-button-active]="selectedType === 'employee_app'"
                [attr.aria-pressed]="selectedType === 'employee_app'" class="user-app-filter-button">
                <span>تطبيق الموظفين</span>
            </button>
        </div>
    </div>
</section>

<section class="p-6 mb-14">
    <app-shared-table [isLoading]="isLoading" [tableData]="users" [columns]="columns" [totalRecords]="totalUsers"
        [rowsPerPage]="rowsPerPage" [currentPage]="currentPage" [activeSearchTerm]="searchTerm"
        (pageChange)="onPageChange($event)" (clearSearch)="onClearSearch()"
        (actionClick)="onTableAction($event)"></app-shared-table>
</section>

<!-- ===== User actions UI ===== -->
<p-toast position="top-left" />
<p-confirmDialog [style]="{ width: '28rem' }" dir="rtl" />

<!-- Send notification -->
<p-dialog header="إرسال إشعار" [(visible)]="notificationDialogVisible" [modal]="true" [draggable]="false"
    [style]="{ width: '30rem' }" dir="rtl">
    <div class="flex flex-col gap-3">
        <span>إلى: <b>{{ selectedUser?.full_name }}</b></span>

        <label for="n-title">عنوان الإشعار</label>
        <input id="n-title" pInputText [(ngModel)]="notificationTitle" />

        <label for="n-body">نص الرسالة</label>
        <textarea id="n-body" pTextarea rows="4" [(ngModel)]="notificationBody"></textarea>
    </div>

    <ng-template #footer>
        <p-button label="إلغاء" severity="secondary" [outlined]="true" (onClick)="notificationDialogVisible = false" />
        <p-button label="إرسال" icon="pi pi-send" [loading]="isActionLoading"
            [disabled]="!notificationTitle.trim() || !notificationBody.trim()" (onClick)="submitNotification()" />
    </ng-template>
</p-dialog>

<!-- Reset password -->
<p-dialog header="إعادة تعيين كلمة المرور" [(visible)]="resetPasswordDialogVisible" [modal]="true" [draggable]="false"
    [style]="{ width: '28rem' }" dir="rtl">
    @if (!generatedPassword) {
    <div class="flex flex-col gap-3">
        <span>المستخدم: <b>{{ selectedUser?.full_name }}</b></span>
        <label for="np">كلمة المرور الجديدة (اختياري)</label>
        <input id="np" pInputText [(ngModel)]="newPassword" />
        <small>اتركه فارغاً لتوليد كلمة مرور عشوائية.</small>
    </div>
    } @else {
    <div class="flex flex-col gap-3">
        <span>كلمة المرور الجديدة:</span>
        <div class="flex items-center gap-2">
            <input pInputText [value]="generatedPassword" readonly class="flex-1" />
            <p-button icon="pi pi-copy" severity="secondary" (onClick)="copyGeneratedPassword()" />
        </div>
        <small>انسخها الآن، لن تظهر مرة أخرى.</small>
    </div>
    }

    <ng-template #footer>
        @if (!generatedPassword) {
        <p-button label="إلغاء" severity="secondary" [outlined]="true" (onClick)="resetPasswordDialogVisible = false" />
        <p-button label="تأكيد" [loading]="isActionLoading" (onClick)="submitResetPassword()" />
        } @else {
        <p-button label="إغلاق" (onClick)="resetPasswordDialogVisible = false" />
        }
    </ng-template>
</p-dialog>
