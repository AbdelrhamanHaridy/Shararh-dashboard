<div class="flex flex-col gap-7 mb-3" dir="rtl">
    <div class="flex flex-col items-center gap-5">
        <div class="p-2 rounded-full flex justify-center items-center w-17.75 h-17.75"
            [class]="isForce ? 'bg-[#FEE2E2]' : 'bg-[#E2FFE5]'">
            <img [src]="isForce ? 'assets/icons/global/red_thunder.svg' : 'assets/icons/global/green_spark.svg'"
                alt="">
        </div>
        <h2 class="text-[#0F172A] text-base font-bold">
            {{ isForce ? 'تحديث إجباري' : 'تخصيص رسالة التحديث' }}
        </h2>
        <p class="text-text-secondary text-xs font-normal text-center">
            @if (isForce) {
            سيُجبر المستخدمون على تحديث الإصدار {{ version }} للمتابعة، راجع الرسالة قبل التفعيل
            } @else {
            قم بصياغة الرسالة التي ستظهر للمستخدمين عند طلب التحديث
            }
        </p>
    </div>

    <div class="flex flex-col gap-4 items-center">
        <!-- Title -->
        <div class="flex flex-col gap-2 w-91 max-w-full">
            <label for="updateTitle" class="text-[#334155] text-[10px] font-bold text-right">
                عنوان الرسالة
            </label>
            <input id="updateTitle" type="text" [maxLength]="titleMaxLength" [value]="title()"
                (input)="title.set($any($event.target).value)"
                class="w-full rounded-2xl border-2 border-[#F1F5F9] bg-[#F8FAFC] px-5 py-3 text-sm text-[#0F172A] outline-none"
                placeholder="اكتب العنوان هنا..." />
        </div>

        <!-- Message -->
        <div class="flex flex-col gap-2 w-91 max-w-full">
            <label for="updateMessage" class="text-[#334155] text-[10px] font-bold text-right">
                نص الرسالة التي ستظهر للمستخدم
            </label>
            <textarea id="updateMessage" [maxLength]="messageMaxLength" [value]="message()"
                (input)="message.set($any($event.target).value)"
                class="w-full h-28.25 rounded-2xl border-2 border-[#F1F5F9] bg-[#F8FAFC] p-5 text-sm text-[#0F172A] resize-none outline-none"
                placeholder="اكتب الرسالة هنا..."></textarea>
            <p class="text-right text-[10px] font-normal text-text-secondary">
                {{ message().length }} / {{ messageMaxLength }} حرف
            </p>
        </div>
    </div>

    <div class="flex flex-row gap-3">
        <button type="button" (click)="submit()" [disabled]="!canSubmit()"
            class="flex-1 py-3 rounded-xl text-white text-sm font-medium transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
            [class]="isForce ? 'bg-[#D22F27] hover:bg-[#B91C1C]' : 'bg-primary hover:bg-[#15803D]'">
            {{ isForce ? 'تفعيل التحديث الإجباري' : 'إرسال التنبيه' }}
        </button>
        <button type="button" (click)="cancel()"
            class="flex-1 py-3 rounded-xl bg-white border border-[#E2E8F0] text-[#475569] hover:bg-gray-50 text-sm font-medium transition-colors cursor-pointer">
            إلغاء
        </button>
    </div>
</div>
