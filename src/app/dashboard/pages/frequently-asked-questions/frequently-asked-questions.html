<p-confirmdialog></p-confirmdialog>

<section class="px-4 sm:px-6">
    <app-page-header title="الاسئله الشائعه" [home]="home" [breadcrumbItems]="breadcrumbItems" [showActionButton]="true"
        actionButtonLabel="إضافة جديد" (actionButtonClick)="showAddFaqDialog()"></app-page-header>
</section>

<section class="px-4 sm:px-6">
    <div class="p-4 sm:p-6 bg-white rounded-2xl shadow-md flex flex-col gap-5">
        <!-- Search Bar -->
        <div class="flex items-center gap-2 px-5 py-4 rounded-[15px] bg-[#F8FAFC] text-[#6B7280]" style="height: 52px;">
            <img src="assets/icons/global/search.svg" alt="search" class="w-5 h-5" />
            <input type="text" placeholder="بحث عن سؤال ,كلمه دلاليه , ....." [ngModel]="searchTerm"
                (ngModelChange)="onSearchInput($event)"
                class="w-full bg-transparent border-none outline-none font-tajawal font-normal text-base leading-none tracking-normal text-right"
                style="color: #6B7280;" />
        </div>

        <!-- Filter Buttons -->
        <div class="flex flex-wrap gap-3 sm:gap-5">
            <button *ngFor="let filter of targetTypeFilters" type="button" (click)="onSelectTargetType(filter.value)"
                [ngClass]="isActiveTargetType(filter.value)
                    ? 'bg-primary-op-10 text-primary border-primary'
                    : 'bg-white text-text-primary border-[#E2E8F0] hover:bg-primary-op-10'"
                class="inline-flex items-center gap-2 rounded-2xl cursor-pointer px-7 py-2 text-sm font-medium border transition-colors">
                <span>{{ filter.label }}</span>
            </button>
        </div>
    </div>
</section>

<!-- Loading / Error states -->
<section class="px-4 sm:px-6 mt-6" *ngIf="isLoading">
    <p class="text-text-secondary text-sm">جاري التحميل...</p>
</section>

<section class="px-4 sm:px-6 mt-6" *ngIf="!isLoading && errorMessage">
    <p class="text-red-500 text-sm">{{ errorMessage }}</p>
</section>

<ng-container *ngIf="!isLoading && !errorMessage">

    <!-- Pinned FAQs -->
    <ng-container *ngIf="pinnedFaqs.length > 0">
        <h2 class="text-black text-lg sm:text-xl font-medium font-tajawal px-4 sm:px-6 mt-6 sm:mt-8">الأسئلة المثبتة
        </h2>

        <section class="p-4 sm:p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
                <div *ngFor="let faq of pinnedFaqs; let i = index; trackBy: trackByFaqId"
                    [ngClass]="i === 0 ? 'md:col-span-2' : 'col-span-1'"
                    class="bg-white rounded-3xl p-4 sm:p-6 border border-[#3D4B361A] flex flex-col gap-4 relative cursor-pointer"
                    (click)="onTogglePin(faq, $event)">
                    <img class="absolute top-5 left-5" src="assets/icons/global/pin_filled.svg" alt="unpin">
                    <span class="px-5 py-2 rounded-full text-xs font-medium font-tajawal shrink-0 w-fit text-white"
                        [style.background-color]="getBadgeMeta(faq.target_type).color">
                        {{ getBadgeMeta(faq.target_type).label }}
                    </span>
                    <p [ngClass]="i === 0 ? 'text-xl sm:text-2xl' : 'text-base sm:text-lg'" class="font-medium">
                        {{ faq.question }}
                    </p>
                    <p class="text-sm sm:text-base text-text-secondary leading-6 line-clamp-3">{{ faq.answer }}</p>
                </div>
            </div>
        </section>
    </ng-container>

    <h2 class="text-black text-lg sm:text-xl font-medium font-tajawal px-4 sm:px-6 mt-2">جميع الاسئله</h2>

    <section class="p-4 sm:p-6">
        <div class="flex justify-center w-full" *ngIf="unpinnedFaqs.length > 0; else noFaqs">
            <p-accordion class="w-full">
                <p-accordion-panel *ngFor="let faq of unpinnedFaqs; trackBy: trackByFaqId" [value]="faq.id.toString()">
                    <p-accordion-header>
                        <span class="inline-flex items-start sm:items-center gap-2 min-w-0 flex-1">
                            <ng-template #toggleicon let-active="active">
                                @if (active) {
                                <div class="order-first p-2 rounded-[5px] bg-[#9F9F9F]">
                                    <img src="assets/icons/global/white_up_arrow.svg" alt="">
                                </div>
                                } @else {
                                <div class="order-first p-2 rounded-[5px] bg-[#64748B]">
                                    <img src="assets/icons/global/white_down_arrow.svg" alt="">
                                </div>
                                }
                            </ng-template>
                            <p
                                class="text-base sm:text-lg text-black font-medium flex flex-wrap gap-2 sm:gap-3 items-center">
                                {{ faq.question }}
                                <span
                                    class="px-2 py-0.5 rounded-sm text-[10px] font-medium font-tajawal shrink-0 w-fit text-white"
                                    [style.background-color]="getBadgeMeta(faq.target_type).color">
                                    {{ getBadgeMeta(faq.target_type).label }}
                                </span>
                            </p>
                        </span>
                        <div class="flex flex-row flex-wrap items-center justify-end gap-1 sm:gap-2 shrink-0">
                            <img class="p-2 cursor-pointer" src="assets/icons/global/pin.svg" alt="pin"
                                (click)="onTogglePin(faq, $event)">
                            <img class="p-2 cursor-pointer" src="assets/icons/global/edit.svg" alt="edit"
                                (click)="onEdit(faq, $event)">
                            <img class="p-2 cursor-pointer" src="assets/icons/global/delete.svg" alt="delete"
                                (click)="onDelete(faq, $event)">
                        </div>
                    </p-accordion-header>
                    <p-accordion-content>
                        <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 items-start">
                            <p class="m-0 text-sm sm:text-base text-[#37393E] leading-6">{{ faq.answer }}</p>
                            <img class="cursor-pointer" src="assets/icons/global/green_clipboard.svg" alt="copy"
                                (click)="onCopyAnswer(faq, $event)">
                        </div>
                    </p-accordion-content>
                </p-accordion-panel>
            </p-accordion>
        </div>

        <ng-template #noFaqs>
            <p class="text-text-secondary text-sm text-center w-full">لا توجد أسئلة متاحة حالياً</p>
        </ng-template>
    </section>

</ng-container>
