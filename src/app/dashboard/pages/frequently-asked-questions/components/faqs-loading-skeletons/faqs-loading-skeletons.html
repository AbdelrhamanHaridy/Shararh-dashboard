
    <!-- Pinned FAQs skeleton -->
    <h2 class="text-black text-lg sm:text-xl font-medium font-tajawal px-4 sm:px-6 mt-6 sm:mt-8">
        <p-skeleton width="140px" height="1.5rem"></p-skeleton>
    </h2>

    <section class="p-4 sm:p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
            <div *ngFor="let _ of [1,2,3,4,5]; let i = index"
                [ngClass]="i === 0 ? 'md:col-span-2' : 'col-span-1'"
                class="bg-white rounded-3xl p-4 sm:p-6 border border-[#3D4B361A] flex flex-col gap-4">
                <p-skeleton width="90px" height="28px" styleClass="rounded-full"></p-skeleton>
                <p-skeleton [width]="i === 0 ? '70%' : '90%'" height="1.5rem"></p-skeleton>
                <div class="flex flex-col gap-2">
                    <p-skeleton width="100%" height="14px"></p-skeleton>
                    <p-skeleton width="100%" height="14px"></p-skeleton>
                    <p-skeleton width="60%" height="14px"></p-skeleton>
                </div>
            </div>
        </div>
    </section>

    <!-- All FAQs skeleton -->
    <h2 class="text-black text-lg sm:text-xl font-medium font-tajawal px-4 sm:px-6 mt-2">
        <p-skeleton width="120px" height="1.5rem"></p-skeleton>
    </h2>

    <section class="p-4 sm:p-6">
        <div class="flex flex-col gap-3 w-full">
            <div *ngFor="let _ of [1,2,3,4,5]"
                class="bg-white rounded-2xl border border-[#3D4B361A] px-4 sm:px-6 py-4 flex items-center justify-between gap-3">
                <span class="inline-flex items-center gap-2 sm:gap-3 min-w-0 flex-1">
                    <p-skeleton shape="rectangle" width="32px" height="32px" styleClass="rounded-[5px] shrink-0"></p-skeleton>
                    <p-skeleton width="55%" height="1.1rem"></p-skeleton>
                    <p-skeleton width="60px" height="18px" styleClass="rounded-sm shrink-0"></p-skeleton>
                </span>
                <div class="flex flex-row items-center gap-1 sm:gap-2 shrink-0">
                    <p-skeleton shape="circle" size="1.75rem"></p-skeleton>
                    <p-skeleton shape="circle" size="1.75rem"></p-skeleton>
                    <p-skeleton shape="circle" size="1.75rem"></p-skeleton>
                </div>
            </div>
        </div>
    </section>
